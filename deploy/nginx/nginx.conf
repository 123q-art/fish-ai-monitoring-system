worker_processes 1;

pid /opt/fish-ai-dashboard/nginx.pid;

error_log /opt/fish-ai-dashboard/logs/error.log;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    access_log /opt/fish-ai-dashboard/logs/access.log;

    server {
        listen 0.0.0.0:18082;

        server_name _;

        root /opt/fish-ai-dashboard/html;
        index index.html;

        # Dashboard自身健康检查
        location = /health {
            default_type application/json;

            return 200 '{"status":"ok","service":"fish-ai-dashboard"}';
        }

        # ----------------------------------------------------
        # 只允许调用 AI 查询接口
        # ----------------------------------------------------
        location /api/cameras/ {

            if ($request_method != GET) {
                return 405;
            }

            proxy_pass http://127.0.0.1:19090;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        # ----------------------------------------------------
        # 明确禁止其它API
        # 特别是 /api/ai/report
        # ----------------------------------------------------
        location /api/ {
            return 404;
        }

        # Dashboard页面

        # FISH_AI_VIDEO_PROXY_V1
        # 将 Dashboard /video/*.flv 转发到本机 ZLMediaKit /live/*.flv
        location ^~ /video/ {

            proxy_pass http://127.0.0.1:80/live/;

            proxy_http_version 1.1;

            proxy_set_header Host 127.0.0.1;
            proxy_set_header Connection "";

            # HTTP-FLV 是持续流，必须关闭代理缓冲
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;

            proxy_connect_timeout 3s;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
